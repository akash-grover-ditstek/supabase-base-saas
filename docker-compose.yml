# Self-contained local stack: everything needed to run (and test) the backend
# with Docker only — no Supabase CLI, Deno or psql on the host.
#
#   docker compose up -d --build                     # start the backend
#   docker compose down -v                           # stop and delete data
#
# Every setting can be overridden from a `.env` file next to this file (see
# README). The defaults are the public Supabase *local development* keys and
# must never be used outside a local machine.

name: saas-backend

x-keys:
  jwt-secret: &jwt-secret ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
  anon-key: &anon-key ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
  service-role-key: &service-role-key ${SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
  postgres-password: &postgres-password ${POSTGRES_PASSWORD:-postgres}
  webhook-secret: &webhook-secret ${STRIPE_WEBHOOK_SECRET:-whsec_local_development_secret_for_tests}

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL (Supabase image: roles, auth/extensions schemas, pgTAP)
  # ---------------------------------------------------------------------------
  db:
    image: supabase/postgres:17.6.1.065
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_PASSWORD: *postgres-password
      POSTGRES_DB: postgres
      PGPASSWORD: *postgres-password
      JWT_SECRET: *jwt-secret
      JWT_EXP: 3600
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - ./docker/db/init/99-service-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-service-roles.sql:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 3s
      timeout: 5s
      retries: 40

  # ---------------------------------------------------------------------------
  # Supabase Auth (GoTrue). Runs its own migrations on start.
  # ---------------------------------------------------------------------------
  auth:
    image: supabase/gotrue:v2.183.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      GOTRUE_SITE_URL: ${APP_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${APP_URL:-http://localhost:3000}/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: *jwt-secret
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      # Invitations are bound to confirmed email addresses: keep confirmation on.
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      GOTRUE_PASSWORD_REQUIRED_CHARACTERS: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789"
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: no-reply@example.test
      GOTRUE_SMTP_SENDER_NAME: SaaS Backend
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 3s
      timeout: 5s
      retries: 40

  # ---------------------------------------------------------------------------
  # Migrations + seed (one-shot). The API starts only after it succeeds.
  # ---------------------------------------------------------------------------
  migrate:
    image: supabase/postgres:17.6.1.065
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    entrypoint: ["bash", "/scripts/migrate.sh"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: *postgres-password
      PGDATABASE: postgres
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - ./supabase:/supabase:ro
      - ./docker/migrate:/scripts:ro
    restart: "no"

  # ---------------------------------------------------------------------------
  # PostgREST: tables and RPCs under RLS, authenticated by the caller's JWT
  # ---------------------------------------------------------------------------
  rest:
    image: postgrest/postgrest:v13.0.8
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: 1000
      PGRST_JWT_SECRET: *jwt-secret
      PGRST_DB_USE_LEGACY_GUCS: "false"

  # ---------------------------------------------------------------------------
  # Edge Functions (built from ./Dockerfile)
  # ---------------------------------------------------------------------------
  functions:
    build: .
    image: saas-backend-functions:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      SUPABASE_URL: http://gateway:8000
      SUPABASE_ANON_KEY: *anon-key
      SUPABASE_SERVICE_ROLE_KEY: *service-role-key
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_local_dummy_key_not_real}
      STRIPE_WEBHOOK_SECRET: *webhook-secret
      APP_URL: ${APP_URL:-http://localhost:3000}
      INTERNAL_SYNC_SECRET: ${INTERNAL_SYNC_SECRET:-local-internal-sync-secret-change-me}
    volumes:
      - functions-cache:/root/.cache/deno

  # ---------------------------------------------------------------------------
  # Gateway: single entry point on http://localhost:8000
  # ---------------------------------------------------------------------------
  gateway:
    image: nginx:1.29.3-alpine
    depends_on:
      - auth
      - rest
      - functions
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 3s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------
  # Mail catcher for Auth emails (invitations, confirmations): http://localhost:8025
  # ---------------------------------------------------------------------------
  mail:
    image: axllent/mailpit:v1.28.0
    ports:
      - "${MAIL_UI_PORT:-8025}:8025"

volumes:
  db-data:
  functions-cache:
