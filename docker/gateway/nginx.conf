# API gateway: exposes the Supabase-compatible paths on one port.
#   /auth/v1/*       -> GoTrue (Supabase Auth)
#   /rest/v1/*       -> PostgREST
#   /functions/v1/*  -> Edge Functions
# Upstreams are resolved per request through Docker's DNS, so the gateway keeps
# working when a service container is recreated.

server {
  listen 8000;
  client_max_body_size 2m;

  resolver 127.0.0.11 valid=10s ipv6=off;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 120s;

  location = /health {
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  location /auth/v1/ {
    set $auth http://auth:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $auth;
  }

  location /rest/v1/ {
    set $rest http://rest:3000;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass $rest;
  }

  location /functions/v1/ {
    set $functions http://functions:9000;
    rewrite ^/functions/v1/(.*)$ /$1 break;
    proxy_pass $functions;
  }

  location / {
    default_type application/json;
    return 404 '{"error":{"code":"not_found","message":"Unknown path"}}';
  }
}
